<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 460" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .frame-border { fill: none; stroke: #334155; stroke-width: 3; rx: 12; }
      .grid-dot { fill: #334155; }
      .sensor-box { rx: 6; stroke-width: 1.5; }
      .sensor-top { fill: #0c4a6e; stroke: #0284c7; }
      .sensor-bottom { fill: #3b0764; stroke: #9333ea; }
      .sensor-left { fill: #451a03; stroke: #d97706; }
      .sensor-right { fill: #500724; stroke: #db2777; }
      .sensor-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
      .sensor-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; fill: #94a3b8; text-anchor: middle; }
      .beam-v { stroke: #0284c7; stroke-width: 1.5; stroke-dasharray: 4,4; opacity: 0.75; }
      .beam-h { stroke: #d97706; stroke-width: 1.5; stroke-dasharray: 4,4; opacity: 0.75; }
      .beam-line { stroke-width: 2; stroke-linecap: round; }
      .line-s1 { stroke: #38bdf8; }
      .line-s2 { stroke: #c084fc; }
      .line-s3 { stroke: #fbbf24; }
      .line-s4 { stroke: #f472b6; }
      .hand-circle { fill: #10b981; fill-opacity: 0.25; stroke: #10b981; stroke-width: 2.5; }
      .dim-line { stroke: #64748b; stroke-width: 1; marker-end: url(#arrow); marker-start: url(#arrow); }
      .dim-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; font-weight: 600; text-anchor: middle; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #f8fafc; }
      .badge { rx: 4; fill: #1e293b; stroke: #475569; stroke-width: 1; }
      .badge-text { font-family: monospace; font-size: 11px; fill: #38bdf8; }
    </style>
    <marker id="arrow" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="740" height="460" rx="14" class="bg"/>

  <!-- Title & Info -->
  <text x="30" y="36" class="title">Ultrasonic 2D Triangulation Frame</text>
  <rect x="520" y="20" width="190" height="24" class="badge"/>
  <text x="615" y="36" text-anchor="middle" class="badge-text">HC-SR04 Active Field</text>

  <!-- Measurement Frame (centered around x=370, y=240, width=380, height=340) -->
  <!-- Origin bottom-left of arena: X=180, Y=390. Width=360, Height=300 -->
  <rect x="180" y="90" width="360" height="300" class="frame-border"/>

  <!-- Arena Grid Pattern -->
  <g class="grid-dot">
    <!-- Row 1 -->
    <circle cx="240" cy="140" r="1.5"/><circle cx="300" cy="140" r="1.5"/><circle cx="360" cy="140" r="1.5"/><circle cx="420" cy="140" r="1.5"/><circle cx="480" cy="140" r="1.5"/>
    <!-- Row 2 -->
    <circle cx="240" cy="190" r="1.5"/><circle cx="300" cy="190" r="1.5"/><circle cx="360" cy="190" r="1.5"/><circle cx="420" cy="190" r="1.5"/><circle cx="480" cy="190" r="1.5"/>
    <!-- Row 3 -->
    <circle cx="240" cy="240" r="1.5"/><circle cx="300" cy="240" r="1.5"/><circle cx="360" cy="240" r="1.5"/><circle cx="420" cy="240" r="1.5"/><circle cx="480" cy="240" r="1.5"/>
    <!-- Row 4 -->
    <circle cx="240" cy="290" r="1.5"/><circle cx="300" cy="290" r="1.5"/><circle cx="360" cy="290" r="1.5"/><circle cx="420" cy="290" r="1.5"/><circle cx="480" cy="290" r="1.5"/>
    <!-- Row 5 -->
    <circle cx="240" cy="340" r="1.5"/><circle cx="300" cy="340" r="1.5"/><circle cx="360" cy="340" r="1.5"/><circle cx="420" cy="340" r="1.5"/><circle cx="480" cy="340" r="1.5"/>
  </g>

  <!-- Hand Position at (X=320, Y=230) in arena space -->
  <!-- Target Hand Coordinates: cx=390, cy=220 -->
  <line x1="390" y1="90" x2="390" y2="390" class="beam-v"/>
  <line x1="180" y1="220" x2="540" y2="220" class="beam-h"/>

  <!-- Sound wave rays from sensors to hand -->
  <line x1="360" y1="90" x2="390" y2="220" class="beam-line line-s1" stroke-dasharray="3,3"/>
  <line x1="360" y1="390" x2="390" y2="220" class="beam-line line-s2" stroke-dasharray="3,3"/>
  <line x1="180" y1="240" x2="390" y2="220" class="beam-line line-s3" stroke-dasharray="3,3"/>
  <line x1="540" y1="240" x2="390" y2="220" class="beam-line line-s4" stroke-dasharray="3,3"/>

  <!-- Hand circle -->
  <circle cx="390" cy="220" r="18" class="hand-circle"/>
  <circle cx="390" cy="220" r="4" fill="#10b981"/>
  <text x="390" y="225" font-size="14" text-anchor="middle">✋</text>

  <!-- Coordinate Tooltip -->
  <rect x="415" y="195" width="115" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="425" y="213" font-family="monospace" font-size="11" fill="#f8fafc" font-weight="700">Hand (X, Y)</text>
  <text x="425" y="228" font-family="monospace" font-size="10" fill="#10b981">X: 28.5  Y: 29.0 cm</text>

  <!-- S1 Sensor (Top) -->
  <g transform="translate(305, 56)">
    <rect width="110" height="34" class="sensor-box sensor-top"/>
    <circle cx="35" cy="17" r="9" fill="#0369a1"/>
    <circle cx="75" cy="17" r="9" fill="#0369a1"/>
    <text x="55" y="15" class="sensor-label">S1 (TOP)</text>
    <text x="55" y="26" class="sensor-sub">Y = 51 cm</text>
  </g>

  <!-- S2 Sensor (Bottom) -->
  <g transform="translate(305, 390)">
    <rect width="110" height="34" class="sensor-box sensor-bottom"/>
    <circle cx="35" cy="17" r="9" fill="#7e22ce"/>
    <circle cx="75" cy="17" r="9" fill="#7e22ce"/>
    <text x="55" y="15" class="sensor-label">S2 (BOTTOM)</text>
    <text x="55" y="26" class="sensor-sub">Y = 0 cm (Origin)</text>
  </g>

  <!-- S3 Sensor (Left) -->
  <g transform="translate(146, 185)">
    <rect width="34" height="110" class="sensor-box sensor-left"/>
    <circle cx="17" cy="35" r="9" fill="#b45309"/>
    <circle cx="17" cy="75" r="9" fill="#b45309"/>
    <text x="17" y="55" class="sensor-label" transform="rotate(-90 17 55)">S3 (LEFT)</text>
  </g>
  <text x="135" y="245" font-family="-apple-system, sans-serif" font-size="9" fill="#d97706" text-anchor="end">X = 0 cm</text>

  <!-- S4 Sensor (Right) -->
  <g transform="translate(540, 185)">
    <rect width="34" height="110" class="sensor-box sensor-right"/>
    <circle cx="17" cy="35" r="9" fill="#be185d"/>
    <circle cx="17" cy="75" r="9" fill="#be185d"/>
    <text x="17" y="55" class="sensor-label" transform="rotate(90 17 55)">S4 (RIGHT)</text>
  </g>
  <text x="585" y="245" font-family="-apple-system, sans-serif" font-size="9" fill="#db2777" text-anchor="start">X = 49 cm</text>

  <!-- Width Dimension Line -->
  <line x1="180" y1="440" x2="540" y2="440" class="dim-line"/>
  <rect x="320" y="430" width="80" height="18" fill="#0b1120"/>
  <text x="360" y="443" class="dim-text">Width: 49 cm</text>

  <!-- Height Dimension Line -->
  <line x1="115" y1="90" x2="115" y2="390" class="dim-line"/>
  <rect x="65" y="230" width="80" height="18" fill="#0b1120"/>
  <text x="105" y="243" class="dim-text">Height: 51 cm</text>

  <!-- Formula Callout (Left Bottom) -->
  <rect x="25" y="345" width="135" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="35" y="365" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Triangulation Math</text>
  <text x="35" y="382" font-family="monospace" font-size="9" fill="#94a3b8">p = (d1²-d2²+D²)</text>
  <text x="65" y="398" font-family="monospace" font-size="9" fill="#94a3b8">/ (2·D)</text>
</svg>


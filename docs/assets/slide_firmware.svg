<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 290" width="100%" height="100%">
  <rect width="380" height="290" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Section 1: Problem Crosstalk vs Solution Time-Multiplexing -->
  <g transform="translate(15, 14)">
    <rect width="350" height="126" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#991b1b">Problema: Interferenza Acustica (Crosstalk)</text>

    <!-- Side by Side in Box 1 -->
    <!-- Left: Simultaneous Ping (WRONG) -->
    <g transform="translate(14, 32)">
      <rect width="155" height="82" rx="6" fill="#ffffff" stroke="#fca5a5"/>
      <text x="77" y="16" font-family="sans-serif" font-weight="bold" font-size="10" fill="#dc2626" text-anchor="middle">❌ Tutti insieme</text>
      <!-- S1 pinging -->
      <circle cx="28" cy="45" r="10" fill="#fee2e2" stroke="#ef4444"/>
      <text x="28" y="49" font-size="9" font-weight="bold" fill="#dc2626" text-anchor="middle">S1</text>
      <!-- S2 receiving wrong wave -->
      <circle cx="127" cy="45" r="10" fill="#fee2e2" stroke="#ef4444"/>
      <text x="127" y="49" font-size="9" font-weight="bold" fill="#dc2626" text-anchor="middle">S2</text>
      <!-- Colliding chaotic waves -->
      <path d="M 42 45 Q 77 25 113 45" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>
      <text x="77" y="74" font-family="sans-serif" font-size="9" fill="#991b1b" text-anchor="middle">Eco falso / Misure errate</text>
    </g>

    <!-- Right: Sequential Ping (RIGHT) -->
    <g transform="translate(181, 32)">
      <rect width="155" height="82" rx="6" fill="#ffffff" stroke="#86efac"/>
      <text x="77" y="16" font-family="sans-serif" font-weight="bold" font-size="10" fill="#16a34a" text-anchor="middle">✔ Uno alla volta (18ms)</text>
      <rect x="15" y="32" width="55" height="22" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
      <text x="42" y="47" font-size="9" font-weight="bold" fill="#0369a1" text-anchor="middle">S1 spara</text>
      <text x="80" y="47" font-size="12" fill="#64748b">→</text>
      <rect x="92" y="32" width="50" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
      <text x="117" y="47" font-size="8" fill="#475569" text-anchor="middle">Silenzio</text>
      <text x="77" y="74" font-family="sans-serif" font-size="9" fill="#15803d" text-anchor="middle">Zero interferenze</text>
    </g>
  </g>

  <!-- Section 2: Timeout Problem vs Solution -->
  <g transform="translate(15, 148)">
    <rect width="350" height="128" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#1e40af">Problema: Blocco della CPU se l'eco si perde</text>

    <!-- Timeout timeline -->
    <g transform="translate(14, 34)">
      <!-- Standard pulseIn (1000ms / default) -->
      <rect width="322" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="0" y="0" width="322" height="16" rx="3" fill="#fee2e2"/>
      <text x="8" y="12" font-family="sans-serif" font-size="9" font-weight="bold" fill="#991b1b">Timeout Standard (fino a 1000 ms):</text>
      <text x="161" y="30" font-family="sans-serif" font-size="9" fill="#b91c1c">❌ Se la mano esce dal campo, Arduino si blocca per 1 secondo!</text>

      <!-- Optimized pulseIn (8ms) -->
      <g transform="translate(0, 46)">
        <rect width="322" height="38" rx="4" fill="#ffffff" stroke="#86efac"/>
        <rect x="0" y="0" width="85" height="16" rx="3" fill="#dcfce7"/>
        <text x="8" y="12" font-family="sans-serif" font-size="9" font-weight="bold" fill="#166534">Timeout 8 ms (137 cm max):</text>
        <rect x="85" y="0" width="237" height="16" rx="3" fill="#f8fafc"/>
        <text x="161" y="30" font-family="sans-serif" font-size="9" font-weight="bold" fill="#15803d">✔ Nessun blocco: passa subito al sensore successivo (18-20 FPS)</text>
      </g>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 460" width="100%" height="100%">
  <defs>
    <style>
      .bg {
        fill: #ffffff;
        stroke: #e2e8f0;
        stroke-width: 1.5;
      }

      .frame-border {
        fill: #f8fafc;
        stroke: #94a3b8;
        stroke-width: 3;
        rx: 12;
      }

      .grid-dot {
        fill: #cbd5e1;
      }

      .sensor-box {
        rx: 6;
        stroke-width: 1.5;
      }

      .sensor-top {
        fill: #e0f2fe;
        stroke: #0284c7;
      }

      .sensor-bottom {
        fill: #f3e8ff;
        stroke: #9333ea;
      }

      .sensor-left {
        fill: #fef3c7;
        stroke: #d97706;
      }

      .sensor-right {
        fill: #fce7f3;
        stroke: #db2777;
      }

      .sensor-label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 11px;
        font-weight: 700;
        text-anchor: middle;
        fill: #0f172a;
      }

      .sensor-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 10px;
        font-weight: 600;
        text-anchor: middle;
        fill: #475569;
      }

      .beam-v {
        stroke: #0284c7;
        stroke-width: 1.5;
        stroke-dasharray: 4, 4;
        opacity: 0.65;
      }

      .beam-h {
        stroke: #d97706;
        stroke-width: 1.5;
        stroke-dasharray: 4, 4;
        opacity: 0.65;
      }

      .beam-line {
        stroke-width: 2;
        stroke-linecap: round;
      }

      .line-s1 {
        stroke: #0284c7;
      }

      .line-s2 {
        stroke: #9333ea;
      }

      .line-s3 {
        stroke: #d97706;
      }

      .line-s4 {
        stroke: #db2777;
      }

      .hand-circle {
        fill: #10b981;
        fill-opacity: 0.2;
        stroke: #059669;
        stroke-width: 2.5;
      }

      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 15px;
        font-weight: 700;
        fill: #0f172a;
      }

      .badge {
        rx: 4;
        fill: #f1f5f9;
        stroke: #cbd5e1;
        stroke-width: 1;
      }

      .badge-text {
        font-family: monospace;
        font-size: 11px;
        fill: #0284c7;
        font-weight: bold;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="740" height="460" rx="14" class="bg" />

  <!-- Title & Info -->
  <text x="30" y="34" class="title">Cornice Acustica di Triangolazione 2D</text>
  <rect x="520" y="18" width="190" height="24" class="badge" />
  <text x="615" y="34" text-anchor="middle" class="badge-text">HC-SR04 Active Field</text>

  <!-- Measurement Frame: X=190, Y=95, Width=360, Height=270 -->
  <rect x="190" y="95" width="360" height="270" class="frame-border" />

  <!-- Arena Grid Pattern -->
  <g class="grid-dot">
    <circle cx="250" cy="140" r="2" />
    <circle cx="310" cy="140" r="2" />
    <circle cx="370" cy="140" r="2" />
    <circle cx="430" cy="140" r="2" />
    <circle cx="490" cy="140" r="2" />
    <circle cx="250" cy="185" r="2" />
    <circle cx="310" cy="185" r="2" />
    <circle cx="370" cy="185" r="2" />
    <circle cx="430" cy="185" r="2" />
    <circle cx="490" cy="185" r="2" />
    <circle cx="250" cy="230" r="2" />
    <circle cx="310" cy="230" r="2" />
    <circle cx="370" cy="230" r="2" />
    <circle cx="430" cy="230" r="2" />
    <circle cx="490" cy="230" r="2" />
    <circle cx="250" cy="275" r="2" />
    <circle cx="310" cy="275" r="2" />
    <circle cx="370" cy="275" r="2" />
    <circle cx="430" cy="275" r="2" />
    <circle cx="490" cy="275" r="2" />
    <circle cx="250" cy="320" r="2" />
    <circle cx="310" cy="320" r="2" />
    <circle cx="370" cy="320" r="2" />
    <circle cx="430" cy="320" r="2" />
    <circle cx="490" cy="320" r="2" />
  </g>

  <!-- Crosshairs -->
  <line x1="390" y1="95" x2="390" y2="365" class="beam-v" />
  <line x1="190" y1="215" x2="550" y2="215" class="beam-h" />

  <!-- Rays from sensors to hand -->
  <line x1="370" y1="95" x2="390" y2="215" class="beam-line line-s1" stroke-dasharray="3,3" />
  <line x1="370" y1="365" x2="390" y2="215" class="beam-line line-s2" stroke-dasharray="3,3" />
  <line x1="190" y1="230" x2="390" y2="215" class="beam-line line-s3" stroke-dasharray="3,3" />
  <line x1="550" y1="230" x2="390" y2="215" class="beam-line line-s4" stroke-dasharray="3,3" />

  <!-- Hand circle -->
  <circle cx="390" cy="215" r="18" class="hand-circle" />
  <circle cx="390" cy="215" r="4" fill="#059669" />
  <text x="390" y="220" font-size="14" text-anchor="middle">✋</text>

  <!-- Coordinate Tooltip -->
  <rect x="415" y="188" width="115" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="425" y="206" font-family="sans-serif" font-size="11" fill="#0f172a" font-weight="700">Mano (X, Y)</text>
  <text x="425" y="221" font-family="monospace" font-size="10" fill="#059669" font-weight="bold">X: 28.5 Y: 29.0
    cm</text>

  <!-- ==================== SENSORS OUTSIDE THE FRAME ==================== -->

  <!-- S1 Sensor (Top): Center at X=370, Y=58 -->
  <g transform="translate(325, 58)">
    <rect width="90" height="34" class="sensor-box sensor-top" />
    <circle cx="26" cy="17" r="9" fill="#0284c7" />
    <circle cx="64" cy="17" r="9" fill="#0284c7" />
  </g>
  <!-- S1 Label ABOVE the sensor -->
  <text x="370" y="44" class="sensor-label">S1 (ALTO) — Y = 51 cm</text>

  <!-- S2 Sensor (Bottom): Center at X=370, Y=368 -->
  <g transform="translate(325, 368)">
    <rect width="90" height="34" class="sensor-box sensor-bottom" />
    <circle cx="26" cy="17" r="9" fill="#9333ea" />
    <circle cx="64" cy="17" r="9" fill="#9333ea" />
  </g>
  <!-- S2 Label BELOW the sensor -->
  <text x="370" y="420" class="sensor-label">S2 (BASSO) — Y = 0 cm (Origine)</text>

  <!-- S3 Sensor (Left): Center at X=152, Y=230 -->
  <g transform="translate(152, 185)">
    <rect width="34" height="90" class="sensor-box sensor-left" />
    <circle cx="17" cy="26" r="9" fill="#d97706" />
    <circle cx="17" cy="64" r="9" fill="#d97706" />
  </g>
  <!-- S3 Label to the LEFT of the sensor -->
  <text x="80" y="224" class="sensor-label" text-anchor="middle">S3 (SX)</text>
  <text x="80" y="240" class="sensor-sub" text-anchor="middle">X = 0 cm</text>

  <!-- S4 Sensor (Right): Center at X=554, Y=230 -->
  <g transform="translate(554, 185)">
    <rect width="34" height="90" class="sensor-box sensor-right" />
    <circle cx="17" cy="26" r="9" fill="#db2777" />
    <circle cx="17" cy="64" r="9" fill="#db2777" />
  </g>
  <!-- S4 Label to the RIGHT of the sensor -->
  <text x="655" y="224" class="sensor-label" text-anchor="middle">S4 (DX)</text>
  <text x="655" y="240" class="sensor-sub" text-anchor="middle">X = 49 cm</text>

  <!-- Frame dimensions -->
  <text x="370" y="445" font-family="sans-serif" font-size="11" fill="#64748b" font-weight="600"
    text-anchor="middle">Dimensioni Cornice: 49 cm (L) × 51 cm (H)</text>
</svg>
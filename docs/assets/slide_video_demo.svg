<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" width="100%" height="100%">
  <rect width="400" height="290" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Video player window mockup -->
  <g transform="translate(20, 20)">
    <rect width="360" height="205" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

    <!-- Window top bar -->
    <rect width="360" height="24" rx="8" fill="#1e293b" />
    <circle cx="16" cy="12" r="4" fill="#ef4444" />
    <circle cx="28" cy="12" r="4" fill="#f59e0b" />
    <circle cx="40" cy="12" r="4" fill="#10b981" />
    <text x="180" y="16" fill="#94a3b8" font-family="sans-serif" font-size="9"
      text-anchor="middle">video_demo_tracking.mp4</text>

    <!-- Hand drawing 'C' inside frame visual -->
    <rect x="25" y="38" width="310" height="120" rx="6" fill="#020617" />
    <!-- Simulated frame perimeter -->
    <rect x="55" y="46" width="250" height="104" rx="4" fill="none" stroke="#334155" stroke-dasharray="3,3" />
    <!-- Red glowing stroke -->
    <path d="M 230 75 C 130 60 110 125 230 135" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
    <circle cx="230" cy="135" r="5" fill="#10b981" />
    <text x="175" y="105" font-size="20" text-anchor="middle">✋</text>

    <!-- Play button overlay -->
    <circle cx="180" cy="100" r="24" fill="#0284c7" fill-opacity="0.85" stroke="#ffffff" stroke-width="2" />
    <polygon points="174,88 192,100 174,112" fill="#ffffff" />

    <!-- Player control bar -->
    <g transform="translate(15, 172)">
      <rect width="330" height="24" rx="4" fill="#1e293b" />
      <polygon points="12,7 20,12 12,17" fill="#38bdf8" />
      <!-- Progress line -->
      <line x1="30" y1="12" x2="270" y2="12" stroke="#334155" stroke-width="3" stroke-linecap="round" />
      <line x1="30" y1="12" x2="160" y2="12" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
      <circle cx="160" cy="12" r="4" fill="#38bdf8" />
      <text x="298" y="15" fill="#cbd5e1" font-family="monospace" font-size="9">00:45</text>
    </g>
  </g>

  <!-- Bottom tag -->
  <rect x="40" y="242" width="320" height="34" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2" />
  <text x="200" y="263" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0369a1"
    text-anchor="middle">Dimostrazione del Sistema in Azione</text>
</svg>
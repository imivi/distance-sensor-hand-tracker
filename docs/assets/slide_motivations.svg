<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 290" width="100%" height="100%">
  <!-- Outer Card -->
  <rect width="380" height="290" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card 1: Privacy First -->
  <g transform="translate(18, 18)">
    <rect width="344" height="74" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2" />
    <!-- Icon Container -->
    <rect x="12" y="12" width="50" height="50" rx="8" fill="#fee2e2" stroke="#f87171" stroke-width="1" />
    <g transform="translate(25, 23)">
      <!-- Camera body -->
      <path
        d="M 2 8 L 6 8 L 8 5 L 16 5 L 18 8 L 22 8 C 23.5 8 24 8.5 24 10 L 24 20 C 24 21.5 23.5 22 22 22 L 2 22 C 0.5 22 0 21.5 0 20 L 0 10 C 0 8.5 0.5 8 2 8 Z"
        fill="#ef4444" />
      <!-- Lens -->
      <circle cx="12" cy="15" r="4.5" fill="#ffffff" />
      <circle cx="12" cy="15" r="2.5" fill="#991b1b" />
      <!-- Slash line (forbidden) -->
      <line x1="-2" y1="2" x2="26" y2="24" stroke="#991b1b" stroke-width="2.5" stroke-linecap="round" />
    </g>
    <!-- Text -->
    <text x="74" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="700" font-size="14" fill="#991b1b">Privacy-First (No Telecamere)</text>
    <text x="74" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11"
      fill="#7f1d1d">Nessuna immagine né video memorizzato</text>
    <text x="74" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10"
      fill="#991b1b" font-weight="600">Ideale in contesti medici e domestici</text>
  </g>

  <!-- Card 2: Zero Wearable -->
  <g transform="translate(18, 108)">
    <rect width="344" height="74" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2" />
    <!-- Icon Container -->
    <rect x="12" y="12" width="50" height="50" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1" />
    <g transform="translate(26, 23)">
      <!-- Hand / Touchless icon -->
      <path
        d="M 12 1 C 10 1 9 2.5 9 4 L 9 11 L 8 11 C 6.5 11 5.5 12 5.5 13.5 L 5.5 16 C 5.5 21 9 24 14 24 C 19 24 21 21 21 16 L 21 8 C 21 6.5 20 5.5 18.5 5.5 C 18 5.5 17.5 5.7 17 6 L 17 4 C 17 2.5 16 1 14 1 C 13.5 1 13 1.2 12.5 1.5 C 12.2 1.2 11.6 1 12 1 Z"
        fill="#2563eb" />
      <!-- Waves around hand -->
      <path d="M 1 9 C -1 13 -1 17 1 21" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
      <path d="M 24 9 C 26 13 26 17 24 21" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
    </g>
    <!-- Text -->
    <text x="74" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="700" font-size="14" fill="#1e40af">Zero Dispositivi Indossabili</text>
    <text x="74" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11"
      fill="#1e3a8a">Nessun guanto, anello o controller</text>
    <text x="74" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10"
      fill="#2563eb" font-weight="600">Interazione touchless a mani libere</text>
  </g>

  <!-- Card 3: Extreme Low Cost -->
  <g transform="translate(18, 198)">
    <rect width="344" height="74" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2" />
    <!-- Icon Container -->
    <rect x="12" y="12" width="50" height="50" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="1" />
    <g transform="translate(26, 23)">
      <!-- Price tag / Chip icon -->
      <rect x="2" y="4" width="18" height="18" rx="3" fill="#16a34a" />
      <circle cx="11" cy="13" r="4" fill="#ffffff" />
      <text x="11" y="16.5" font-family="sans-serif" font-weight="bold" font-size="10" fill="#16a34a"
        text-anchor="middle">€</text>
      <line x1="20" y1="9" x2="23" y2="9" stroke="#16a34a" stroke-width="2" />
      <line x1="20" y1="13" x2="24" y2="13" stroke="#16a34a" stroke-width="2" />
      <line x1="20" y1="17" x2="23" y2="17" stroke="#16a34a" stroke-width="2" />
    </g>
    <!-- Text -->
    <text x="74" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="700" font-size="14" fill="#166534">Economicità Estrema (&lt; 15€)</text>
    <text x="74" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11"
      fill="#14532d">4x HC-SR04 (~6€) + Arduino Nano (~5€)</text>
    <text x="74" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10"
      fill="#16a34a" font-weight="600">Alternativa a sensori LiDAR/Vision da &gt;100€</text>
  </g>
</svg>
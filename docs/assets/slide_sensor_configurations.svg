<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" width="100%" height="100%">
  <rect width="400" height="290" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Config 1: 4 in Parallelo -->
  <g transform="translate(18, 16)">
    <rect width="364" height="74" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" />
    <rect x="12" y="12" width="65" height="50" rx="6" fill="#ffffff" stroke="#ef4444" />
    <!-- 4 parallel sensors side by side -->
    <rect x="18" y="24" width="7" height="26" rx="2" fill="#dc2626" />
    <rect x="30" y="24" width="7" height="26" rx="2" fill="#dc2626" />
    <rect x="42" y="24" width="7" height="26" rx="2" fill="#dc2626" />
    <rect x="54" y="24" width="7" height="26" rx="2" fill="#dc2626" />

    <text x="88" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="700" font-size="13" fill="#991b1b">1. Quattro Sensori in Parallelo</text>
    <text x="88" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11"
      fill="#7f1d1d">• Coni acustici sovrapposti e forti interferenze</text>
    <text x="88" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10"
      fill="#dc2626" font-weight="bold">❌ Nessuna triangolazione 2D (solo profondità 1D)</text>
  </g>

  <!-- Config 2: 2 Perpendicolari -->
  <g transform="translate(18, 104)">
    <rect width="364" height="74" rx="8" fill="#fefce8" stroke="#fde047" stroke-width="1.2" />
    <rect x="12" y="12" width="65" height="50" rx="6" fill="#ffffff" stroke="#eab308" />
    <!-- L-shape perpendicular sensors -->
    <rect x="22" y="20" width="8" height="26" rx="2" fill="#ca8a04" />
    <rect x="26" y="44" width="30" height="8" rx="2" fill="#ca8a04" />

    <text x="88" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="700" font-size="13" fill="#854d0e">2. Due Sensori Perpendicolari (X, Y)</text>
    <text x="88" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11"
      fill="#713f12">• Copertura di base del piano cartesiano</text>
    <text x="88" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10"
      fill="#b45309" font-weight="bold">⚠️ L'altezza della mano (Z) altera la posizione X e Y</text>
  </g>

  <!-- Config 3: 4 Opposti (2 per asse) -->
  <g transform="translate(18, 192)">
    <rect width="364" height="82" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <rect x="12" y="12" width="65" height="58" rx="6" fill="#ffffff" stroke="#16a34a" />
    <!-- 4 opposing sensors arena -->
    <rect x="36" y="16" width="16" height="6" rx="1.5" fill="#16a34a" />
    <rect x="36" y="58" width="16" height="6" rx="1.5" fill="#16a34a" />
    <rect x="16" y="33" width="6" height="16" rx="1.5" fill="#16a34a" />
    <rect x="66" y="33" width="6" height="16" rx="1.5" fill="#16a34a" />

    <text x="88" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="700" font-size="13" fill="#166534">3. Quattro Sensori Opposti (2 per asse)</text>
    <text x="88" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11"
      fill="#14532d">• Cornice 49×51 cm con triangolazione pitagorica</text>
    <text x="88" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10"
      fill="#15803d" font-weight="bold">✔ L'altezza Z si cancella: tracking 2D puro ed esatto</text>
  </g>
</svg>
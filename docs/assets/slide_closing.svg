<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 200" width="100%" height="100%">
  <defs>
    <style>
      .card-closing {
        fill: #ffffff;
        stroke: #e2e8f0;
        stroke-width: 1.5;
        rx: 14;
      }

      .title-qa {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 24px;
        font-weight: 800;
        fill: #0f172a;
      }

      .text-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        fill: #475569;
      }

      .pill {
        fill: #f1f5f9;
        stroke: #cbd5e1;
        stroke-width: 1.2;
        rx: 6;
      }

      .pill-txt {
        font-family: monospace;
        font-size: 11px;
        font-weight: bold;
        fill: #0284c7;
        text-anchor: middle;
      }
    </style>
  </defs>

  <rect width="650" height="200" rx="14" class="card-closing" />

  <!-- Center Q&A Badge -->
  <g transform="translate(195, 24)">
    <rect width="260" height="52" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <text x="130" y="34" class="title-qa" fill="#0369a1" text-anchor="middle">DOMANDE &amp; RISPOSTE</text>
  </g>

  <!-- Subtitle -->
  <text x="325" y="105" class="text-sub" font-size="14" text-anchor="middle">Spazio aperto per chiarimenti tecnici,
    curiosità e approfondimenti</text>

  <!-- Spec Badges Row -->
  <g transform="translate(75, 128)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="150" height="38" class="pill" />
    <text x="75" y="24" class="pill-txt">4x HC-SR04 + Nano</text>

    <!-- Badge 2 -->
    <rect x="170" y="0" width="160" height="38" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.2" />
    <text x="250" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#166534"
      text-anchor="middle">Accuratezza: 91.1%</text>

    <!-- Badge 3 -->
    <rect x="350" y="0" width="150" height="38" class="pill" />
    <text x="425" y="24" class="pill-txt">FastAPI &amp; WebSockets</text>
  </g>
</svg>
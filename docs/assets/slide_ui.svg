<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 290" width="100%" height="100%">
  <rect width="350" height="290" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <!-- UI Mockup window -->
  <rect x="15" y="15" width="320" height="260" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <circle cx="30" cy="28" r="4" fill="#ef4444" />
  <circle cx="42" cy="28" r="4" fill="#f59e0b" />
  <circle cx="54" cy="28" r="4" fill="#10b981" />
  <text x="175" y="32" fill="#475569" font-family="sans-serif" font-weight="bold" font-size="10"
    text-anchor="middle">Ultrasonic Gesture Tracker UI</text>

  <!-- 2D Canvas Area -->
  <rect x="25" y="45" width="180" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1" />
  <!-- Stroke drawn 'C' -->
  <path d="M 160 85 C 90 70 80 150 160 160" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" />
  <circle cx="160" cy="160" r="5" fill="#10b981" />
  <text x="115" y="120" font-size="14" text-anchor="middle">✋</text>

  <!-- Prediction Panel -->
  <rect x="215" y="45" width="110" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1" />
  <text x="270" y="65" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">PREDICTION</text>
  <text x="270" y="105" fill="#15803d" font-family="sans-serif" font-weight="bold" font-size="34"
    text-anchor="middle">C</text>
  <text x="270" y="125" fill="#0369a1" font-family="sans-serif" font-weight="bold" font-size="10"
    text-anchor="middle">Conf: 94.2%</text>
  <rect x="225" y="140" width="90" height="6" rx="3" fill="#e2e8f0" />
  <rect x="225" y="140" width="84" height="6" rx="3" fill="#10b981" />

  <!-- Controls bottom -->
  <rect x="25" y="208" width="180" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" />
  <text x="115" y="226" fill="#334155" font-family="sans-serif" font-weight="600" font-size="9"
    text-anchor="middle">WebSockets: 30 FPS Stream</text>
  <rect x="35" y="234" width="160" height="18" rx="4" fill="#0284c7" />
  <text x="115" y="246" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="9"
    text-anchor="middle">Test Mode / Record</text>

  <rect x="215" y="208" width="110" height="52" rx="6" fill="#0284c7" />
  <text x="270" y="238" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10"
    text-anchor="middle">Retrain Model</text>
</svg>
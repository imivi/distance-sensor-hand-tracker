<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" width="100%" height="100%">
  <rect width="400" height="290" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Config 1: 4 in Parallelo -->
  <g transform="translate(18, 16)">
    <rect width="364" height="74" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" />
    <g transform="translate(149, 12)">
      <rect width="65" height="50" rx="6" fill="#ffffff" stroke="#ef4444" />
      <!-- 4 parallel sensors side by side -->
      <rect x="6" y="12" width="7" height="26" rx="2" fill="#dc2626" />
      <rect x="18" y="12" width="7" height="26" rx="2" fill="#dc2626" />
      <rect x="30" y="12" width="7" height="26" rx="2" fill="#dc2626" />
      <rect x="42" y="12" width="7" height="26" rx="2" fill="#dc2626" />
    </g>
  </g>

  <!-- Config 2: 2 Perpendicolari -->
  <g transform="translate(18, 104)">
    <rect width="364" height="74" rx="8" fill="#fefce8" stroke="#fde047" stroke-width="1.2" />
    <g transform="translate(149, 12)">
      <rect width="65" height="50" rx="6" fill="#ffffff" stroke="#eab308" />
      <!-- L-shape perpendicular sensors -->
      <rect x="10" y="8" width="8" height="26" rx="2" fill="#ca8a04" />
      <rect x="14" y="32" width="30" height="8" rx="2" fill="#ca8a04" />
    </g>
  </g>

  <!-- Config 3: 4 Opposti (2 per asse) -->
  <g transform="translate(18, 192)">
    <rect width="364" height="82" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <g transform="translate(149, 12)">
      <rect width="65" height="58" rx="6" fill="#ffffff" stroke="#16a34a" />
      <!-- 4 opposing sensors arena -->
      <rect x="24.5" y="4" width="16" height="6" rx="1.5" fill="#16a34a" />
      <rect x="24.5" y="48" width="16" height="6" rx="1.5" fill="#16a34a" />
      <rect x="4" y="21" width="6" height="16" rx="1.5" fill="#16a34a" />
      <rect x="55" y="21" width="6" height="16" rx="1.5" fill="#16a34a" />
    </g>
  </g>
</svg>
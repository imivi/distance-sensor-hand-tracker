<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <style>
      .bg {
        fill: #ffffff;
        stroke: #e2e8f0;
        stroke-width: 1.5;
      }

      .card {
        fill: #f8fafc;
        stroke: #cbd5e1;
        stroke-width: 1.5;
        rx: 10;
      }

      .header-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: #0f172a;
      }

      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 10px;
        fill: #475569;
      }

      .code-text {
        font-family: monospace;
        font-size: 10px;
        fill: #0284c7;
        font-weight: bold;
      }

      .arrow {
        stroke: #0284c7;
        stroke-width: 2;
        fill: none;
      }

      .grid-cell {
        stroke: #cbd5e1;
        stroke-width: 1;
      }

      .cell-off {
        fill: #ffffff;
      }

      .cell-on {
        fill: #fee2e2;
        stroke: #f87171;
      }

      .stroke-point {
        fill: #dc2626;
        stroke: #ffffff;
        stroke-width: 1.5;
      }

      .feat-box {
        fill: #ffffff;
        stroke: #0284c7;
        stroke-width: 1.2;
        rx: 4;
      }

      .feat-txt {
        font-family: monospace;
        font-size: 9px;
        fill: #0369a1;
        text-anchor: middle;
        font-weight: bold;
      }

      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 15px;
        font-weight: 700;
        fill: #0f172a;
      }
    </style>
  </defs>

  <rect width="880" height="340" rx="14" class="bg" />

  <!-- Title -->
  <text x="30" y="36" class="title">Pipeline di Estrazione Feature (Traiettoria Grezza → Vettore 39D)</text>

  <!-- Step 1: Raw Trajectory -->
  <g transform="translate(30, 65)">
    <rect width="180" height="245" class="card" />
    <text x="18" y="28" class="header-text">1. Punti Acquisiti (X, Y)</text>
    <text x="18" y="45" class="sub-text">Campionati a ~15-18 Hz in cm</text>

    <!-- Mini stroke canvas drawing letter 'C' -->
    <rect x="25" y="60" width="130" height="130" rx="6" fill="#ffffff" stroke="#cbd5e1" />
    <path d="M 130 85 C 60 70 50 160 130 165" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="130" cy="85" r="4" class="stroke-point" />
    <circle cx="95" cy="80" r="3" fill="#dc2626" />
    <circle cx="68" cy="95" r="3" fill="#dc2626" />
    <circle cx="58" cy="125" r="3" fill="#dc2626" />
    <circle cx="70" cy="155" r="3" fill="#dc2626" />
    <circle cx="100" cy="165" r="3" fill="#dc2626" />
    <circle cx="130" cy="165" r="4" class="stroke-point" />

    <!-- Bounding Box outline -->
    <rect x="52" y="74" width="85" height="97" fill="none" stroke="#0284c7" stroke-dasharray="3,3" stroke-width="1.2" />
    <text x="90" y="210" font-family="sans-serif" font-size="10" fill="#475569" text-anchor="middle">Bounding Box (W,
      H)</text>
    <text x="90" y="226" class="code-text" text-anchor="middle">N = 28 coordinate</text>
  </g>

  <!-- Connector Arrow 1 -->
  <g transform="translate(210, 180)">
    <line x1="0" y1="5" x2="32" y2="5" class="arrow" />
    <polygon points="32,0 40,5 32,10" fill="#0284c7" />
  </g>

  <!-- Step 2: 6x6 Occupancy Grid -->
  <g transform="translate(255, 65)">
    <rect width="210" height="245" class="card" />
    <text x="18" y="28" class="header-text">2. Griglia 6×6 Rasterizzata</text>
    <text x="18" y="45" class="sub-text">Interpolazione continua del tratto</text>

    <!-- 6x6 Grid of 20x20 squares -->
    <g transform="translate(45, 62)">
      <!-- Row 0: empty except top of C -->
      <rect x="0" y="0" width="20" height="20" class="grid-cell cell-off" />
      <rect x="20" y="0" width="20" height="20" class="grid-cell cell-on" />
      <rect x="40" y="0" width="20" height="20" class="grid-cell cell-on" />
      <rect x="60" y="0" width="20" height="20" class="grid-cell cell-on" />
      <rect x="80" y="0" width="20" height="20" class="grid-cell cell-on" />
      <rect x="100" y="0" width="20" height="20" class="grid-cell cell-off" />

      <!-- Row 1: left edge -->
      <rect x="0" y="20" width="20" height="20" class="grid-cell cell-on" />
      <rect x="20" y="20" width="20" height="20" class="grid-cell cell-on" />
      <rect x="40" y="20" width="20" height="20" class="grid-cell cell-off" />
      <rect x="60" y="20" width="20" height="20" class="grid-cell cell-off" />
      <rect x="80" y="20" width="20" height="20" class="grid-cell cell-off" />
      <rect x="100" y="20" width="20" height="20" class="grid-cell cell-off" />

      <!-- Row 2: left edge -->
      <rect x="0" y="40" width="20" height="20" class="grid-cell cell-on" />
      <rect x="20" y="40" width="20" height="20" class="grid-cell cell-off" />
      <rect x="40" y="40" width="20" height="20" class="grid-cell cell-off" />
      <rect x="60" y="40" width="20" height="20" class="grid-cell cell-off" />
      <rect x="80" y="40" width="20" height="20" class="grid-cell cell-off" />
      <rect x="100" y="40" width="20" height="20" class="grid-cell cell-off" />

      <!-- Row 3: left edge -->
      <rect x="0" y="60" width="20" height="20" class="grid-cell cell-on" />
      <rect x="20" y="60" width="20" height="20" class="grid-cell cell-off" />
      <rect x="40" y="60" width="20" height="20" class="grid-cell cell-off" />
      <rect x="60" y="60" width="20" height="20" class="grid-cell cell-off" />
      <rect x="80" y="20" width="20" height="20" class="grid-cell cell-off" />
      <rect x="100" y="20" width="20" height="20" class="grid-cell cell-off" />

      <!-- Row 4: bottom curve -->
      <rect x="0" y="80" width="20" height="20" class="grid-cell cell-on" />
      <rect x="20" y="80" width="20" height="20" class="grid-cell cell-on" />
      <rect x="40" y="80" width="20" height="20" class="grid-cell cell-off" />
      <rect x="60" y="80" width="20" height="20" class="grid-cell cell-off" />
      <rect x="80" y="80" width="20" height="20" class="grid-cell cell-off" />
      <rect x="100" y="80" width="20" height="20" class="grid-cell cell-off" />

      <!-- Row 5: bottom-right -->
      <rect x="0" y="100" width="20" height="20" class="grid-cell cell-off" />
      <rect x="20" y="100" width="20" height="20" class="grid-cell cell-on" />
      <rect x="40" y="100" width="20" height="20" class="grid-cell cell-on" />
      <rect x="60" y="100" width="20" height="20" class="grid-cell cell-on" />
      <rect x="80" y="100" width="20" height="20" class="grid-cell cell-on" />
      <rect x="100" y="100" width="20" height="20" class="grid-cell cell-off" />
    </g>

    <text x="105" y="212" class="code-text" text-anchor="middle">36 Features Booleane (0/1)</text>
    <text x="105" y="228" font-family="sans-serif" font-size="9" fill="#166534" font-weight="bold"
      text-anchor="middle">Invariante al Verso di Scrittura</text>
  </g>

  <!-- Connector Arrow 2 -->
  <g transform="translate(470, 180)">
    <line x1="0" y1="5" x2="32" y2="5" class="arrow" />
    <polygon points="32,0 40,5 32,10" fill="#0284c7" />
  </g>

  <!-- Step 3: 39D Feature Vector -->
  <g transform="translate(515, 65)">
    <rect width="335" height="245" class="card" />
    <text x="18" y="28" class="header-text">3. Vettore Unificato (39D)</text>
    <text x="18" y="45" class="sub-text">Input finale per il modello Random Forest</text>

    <!-- Vector visual -->
    <g transform="translate(20, 65)">
      <!-- 36 Grid features block -->
      <rect x="0" y="0" width="195" height="34" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" />
      <text x="97" y="18" class="feat-txt">grid[0..35] : 36 binary</text>
      <text x="97" y="29" font-family="sans-serif" font-size="8" fill="#475569" text-anchor="middle">Forma
        Normalizzata</text>

      <!-- Plus sign -->
      <text x="206" y="22" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f172a">+</text>

      <!-- 3 Global shape features block -->
      <rect x="220" y="0" width="75" height="34" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.2" />
      <text x="257" y="18" font-family="monospace" font-size="9" fill="#b45309" font-weight="bold"
        text-anchor="middle">3 metrics</text>
      <text x="257" y="29" font-family="sans-serif" font-size="8" fill="#475569" text-anchor="middle">H/W, W, H</text>
    </g>

    <!-- Metrics details table -->
    <g transform="translate(20, 115)">
      <rect x="0" y="0" width="295" height="110" rx="6" fill="#ffffff" stroke="#cbd5e1" />
      <text x="12" y="22" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0369a1">•
        aspect_ratio</text>
      <text x="110" y="22" font-family="sans-serif" font-size="10" fill="#475569">= Altezza / Larghezza</text>

      <text x="12" y="44" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0369a1">•
        bbox_width_cm</text>
      <text x="110" y="44" font-family="sans-serif" font-size="10" fill="#475569">= Larghezza reale (cm)</text>

      <text x="12" y="66" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0369a1">•
        bbox_height_cm</text>
      <text x="110" y="66" font-family="sans-serif" font-size="10" fill="#475569">= Altezza reale (cm)</text>

      <line x1="12" y1="80" x2="283" y2="80" stroke="#e2e8f0" stroke-width="1" />
      <text x="147" y="98" font-family="sans-serif" font-size="10" font-weight="bold" fill="#15803d"
        text-anchor="middle">Dimensione Totale: 39 Features</text>
    </g>
  </g>
</svg>
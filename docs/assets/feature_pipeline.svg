<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" width="100%" height="100%">
  <defs>
    <style>
      .panel-bg {
        fill: #ffffff;
        stroke: #e2e8f0;
        stroke-width: 1.5;
        rx: 12;
      }

      .box {
        fill: #f8fafc;
        stroke: #cbd5e1;
        stroke-width: 1.5;
        rx: 8;
      }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        font-weight: 700;
        fill: #0f172a;
      }

      .label-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        fill: #475569;
      }

      .code-bold {
        font-family: monospace;
        font-size: 12px;
        font-weight: bold;
        fill: #0284c7;
      }

      .grid-cell {
        stroke: #cbd5e1;
        stroke-width: 1;
      }

      .cell-off {
        fill: #ffffff;
      }

      .cell-on {
        fill: #fee2e2;
        stroke: #f87171;
      }

      .arrow-line {
        stroke: #0284c7;
        stroke-width: 2.5;
        fill: none;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="460" height="380" rx="12" class="panel-bg" />

  <!-- TOP ROW: Step 1 (Raw Stroke) & Step 2 (6x6 Grid) Side-by-Side -->

  <!-- STEP 1: Raw Coordinates -->
  <g transform="translate(18, 16)">
    <rect width="195" height="215" class="box" />
    <text x="97" y="24" class="title-text" text-anchor="middle">1. Coordinate (X, Y)</text>
    <text x="97" y="40" class="label-text" text-anchor="middle">Traiettoria nel tempo</text>

    <!-- Canvas area -->
    <rect x="25" y="52" width="145" height="120" rx="6" fill="#ffffff" stroke="#cbd5e1" />
    <!-- Drawn stroke 'C' -->
    <path d="M 135 75 C 65 60 55 145 135 150" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" />
    <circle cx="135" cy="75" r="4.5" fill="#dc2626" />
    <circle cx="98" cy="70" r="3.5" fill="#dc2626" />
    <circle cx="70" cy="85" r="3.5" fill="#dc2626" />
    <circle cx="62" cy="112" r="3.5" fill="#dc2626" />
    <circle cx="75" cy="140" r="3.5" fill="#dc2626" />
    <circle cx="105" cy="150" r="3.5" fill="#dc2626" />
    <circle cx="135" cy="150" r="4.5" fill="#dc2626" />

    <!-- Bounding Box dotted -->
    <rect x="52" y="64" width="92" height="92" fill="none" stroke="#0284c7" stroke-dasharray="3,3" stroke-width="1.5" />
    <text x="97" y="192" font-family="sans-serif" font-size="11" font-weight="600" fill="#0369a1"
      text-anchor="middle">Bounding Box (W, H)</text>
    <text x="97" y="206" class="label-text" text-anchor="middle">Scalatura uniforme</text>
  </g>

  <!-- Arrow between Step 1 and Step 2 -->
  <g transform="translate(216, 115)">
    <line x1="0" y1="5" x2="22" y2="5" class="arrow-line" />
    <polygon points="22,0 28,5 22,10" fill="#0284c7" />
  </g>

  <!-- STEP 2: 6x6 Occupancy Grid -->
  <g transform="translate(247, 16)">
    <rect width="195" height="215" class="box" />
    <text x="97" y="24" class="title-text" text-anchor="middle">2. Griglia 6×6</text>
    <text x="97" y="40" class="label-text" text-anchor="middle">Interpolazione continua</text>

    <!-- 6x6 Raster Grid (each cell 18x18, total 108x108) -->
    <g transform="translate(43, 58)">
      <!-- Row 0 -->
      <rect x="0" y="0" width="18" height="18" class="grid-cell cell-off" />
      <rect x="18" y="0" width="18" height="18" class="grid-cell cell-on" />
      <rect x="36" y="0" width="18" height="18" class="grid-cell cell-on" />
      <rect x="54" y="0" width="18" height="18" class="grid-cell cell-on" />
      <rect x="72" y="0" width="18" height="18" class="grid-cell cell-on" />
      <rect x="90" y="0" width="18" height="18" class="grid-cell cell-off" />
      <!-- Row 1 -->
      <rect x="0" y="18" width="18" height="18" class="grid-cell cell-on" />
      <rect x="18" y="18" width="18" height="18" class="grid-cell cell-on" />
      <rect x="36" y="18" width="18" height="18" class="grid-cell cell-off" />
      <rect x="54" y="18" width="18" height="18" class="grid-cell cell-off" />
      <rect x="72" y="18" width="18" height="18" class="grid-cell cell-off" />
      <rect x="90" y="18" width="18" height="18" class="grid-cell cell-off" />
      <!-- Row 2 -->
      <rect x="0" y="36" width="18" height="18" class="grid-cell cell-on" />
      <rect x="18" y="36" width="18" height="18" class="grid-cell cell-off" />
      <rect x="36" y="36" width="18" height="18" class="grid-cell cell-off" />
      <rect x="54" y="36" width="18" height="18" class="grid-cell cell-off" />
      <rect x="72" y="36" width="18" height="18" class="grid-cell cell-off" />
      <rect x="90" y="36" width="18" height="18" class="grid-cell cell-off" />
      <!-- Row 3 -->
      <rect x="0" y="54" width="18" height="18" class="grid-cell cell-on" />
      <rect x="18" y="54" width="18" height="18" class="grid-cell cell-off" />
      <rect x="36" y="54" width="18" height="18" class="grid-cell cell-off" />
      <rect x="54" y="54" width="18" height="18" class="grid-cell cell-off" />
      <rect x="72" y="54" width="18" height="18" class="grid-cell cell-off" />
      <rect x="90" y="54" width="18" height="18" class="grid-cell cell-off" />
      <!-- Row 4 -->
      <rect x="0" y="72" width="18" height="18" class="grid-cell cell-on" />
      <rect x="18" y="72" width="18" height="18" class="grid-cell cell-on" />
      <rect x="36" y="72" width="18" height="18" class="grid-cell cell-off" />
      <rect x="54" y="72" width="18" height="18" class="grid-cell cell-off" />
      <rect x="72" y="72" width="18" height="18" class="grid-cell cell-off" />
      <rect x="90" y="72" width="18" height="18" class="grid-cell cell-off" />
      <!-- Row 5 -->
      <rect x="0" y="90" width="18" height="18" class="grid-cell cell-off" />
      <rect x="18" y="90" width="18" height="18" class="grid-cell cell-on" />
      <rect x="36" y="90" width="18" height="18" class="grid-cell cell-on" />
      <rect x="54" y="90" width="18" height="18" class="grid-cell cell-on" />
      <rect x="72" y="90" width="18" height="18" class="grid-cell cell-on" />
      <rect x="90" y="90" width="18" height="18" class="grid-cell cell-off" />
    </g>

    <text x="97" y="190" font-family="sans-serif" font-size="12" font-weight="700" fill="#15803d"
      text-anchor="middle">36 Valori Booleani</text>
    <text x="97" y="206" font-family="sans-serif" font-size="10" font-weight="600" fill="#166534" text-anchor="middle">✔
      Invariante al verso</text>
  </g>

  <!-- BOTTOM ROW: Step 3 (Unified 39D Feature Vector) -->
  <g transform="translate(18, 244)">
    <rect width="424" height="120" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="212" y="24" class="title-text" fill="#166534" text-anchor="middle">3. Vettore Finale per il Modello (39
      Dimensioni)</text>

    <!-- Vector Breakdown -->
    <g transform="translate(16, 38)">
      <!-- 36 Grid features -->
      <rect x="0" y="0" width="230" height="34" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
      <text x="115" y="22" class="code-bold" text-anchor="middle">36 Celle Griglia [0 / 1]</text>
      <text x="115" y="48" font-family="sans-serif" font-size="10" fill="#475569" text-anchor="middle">Occupanza
        Spaziale</text>

      <!-- Plus sign -->
      <text x="246" y="24" font-family="sans-serif" font-size="18" font-weight="800" fill="#0f172a"
        text-anchor="middle">+</text>

      <!-- 3 Global shape features -->
      <rect x="262" y="0" width="130" height="34" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5" />
      <text x="327" y="22" font-family="monospace" font-size="12" font-weight="bold" fill="#b45309"
        text-anchor="middle">3 Metriche</text>
      <text x="327" y="48" font-family="sans-serif" font-size="10" fill="#475569" text-anchor="middle">Rapporto H/W,
        Larghezza, Altezza</text>
    </g>

    <!-- Total badge -->
    <text x="212" y="108" font-family="sans-serif" font-size="12" font-weight="bold" fill="#15803d"
      text-anchor="middle">Input compatto e ultra-veloce (inferenza &lt; 1 ms)</text>
  </g>
</svg>